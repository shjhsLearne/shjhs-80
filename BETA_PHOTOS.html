<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三峽國中 - 歷年畢業紀念冊集錦</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 穩定的多欄瀑布流排版：確保所有分頁（首頁、資料夾、最受歡迎）皆保持一致的生動美感與絕對不位移 */
        .stable-masonry-container {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        .masonry-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }

        @media (min-width: 640px) { 
            .stable-masonry-container { gap: 16px; } 
            .masonry-column { gap: 16px; }
        }
        @media (min-width: 1024px) { 
            .stable-masonry-container { gap: 20px; } 
            .masonry-column { gap: 20px; }
        }
        @media (min-width: 1280px) { 
            .stable-masonry-container { gap: 24px; } 
            .masonry-column { gap: 24px; }
        }
    </style>
</head>
<body class="bg-white text-gray-800 flex h-screen overflow-hidden">

    <!-- 手機/平板側邊欄背後的半透明遮罩 -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden transition-opacity" onclick="toggleSidebar()"></div>

    <!-- 側邊欄 -->
    <aside id="sidebar" class="w-72 flex-shrink-0 flex flex-col border-r border-gray-200 p-4 select-none bg-white fixed md:static inset-y-0 left-0 z-30 transform -translate-x-full md:translate-x-0 transition-all duration-300 overflow-hidden shadow-xl md:shadow-none">
        <!-- Logo 與標題及收合按鈕 -->
        <div class="flex items-center justify-between px-2 mb-6 min-w-[250px]">
            <div class="flex items-center gap-3">
                <img src="https://lh3.googleusercontent.com/d/13oP5AHjeYAC7eOud7dizpkiV-hxzlGUL=s400" alt="Logo" class="w-10 h-10 rounded-full object-cover flex-shrink-0 shadow-sm border border-gray-100">
                <div>
                    <h1 class="text-sm font-bold text-gray-800 leading-tight">三峽國中</h1>
                    <p class="text-xs text-blue-600 font-medium">歷年畢業紀念冊集錦</p>
                </div>
            </div>
            <!-- 電腦版：專屬收合按鈕 -->
            <button onclick="toggleSidebar()" class="hidden md:flex p-1.5 text-gray-500 hover:bg-gray-100 rounded-lg transition" title="收合選單">
                <span class="material-icons text-xl">menu_open</span>
            </button>
        </div>

        <!-- 搜尋框 -->
        <div class="px-2 mb-6">
            <div class="flex items-center w-full bg-gray-100 rounded-full px-4 py-2 shadow-inner border border-gray-50">
                <span class="material-icons text-gray-500 mr-2 text-sm flex-shrink-0">search</span>
                <input type="text" id="search-input" placeholder="搜尋相片..." class="bg-transparent border-none outline-none w-full text-sm text-gray-700 truncate" oninput="handleSearch()">
            </div>
        </div>

        <!-- 導覽與資料夾選單區 -->
        <div class="flex-1 overflow-y-auto space-y-1 pr-1 min-w-[250px]">
            <p class="px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">相簿選單</p>
            <div id="folder-list" class="space-y-1">
                <button onclick="filterPhotosByFolder('all', '全部相片')" id="btn-all" class="w-full flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-700 rounded-full font-medium text-sm transition text-left">
                    <span class="material-icons text-blue-600">photo_library</span>全部相片
                </button>
                <button onclick="filterPhotosByFolder('ai-popular', '✨ 最受歡迎校慶回憶')" id="btn-ai-popular" class="w-full flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-full text-sm transition text-left">
                    <span class="material-icons text-blue-500">thumb_up</span>✨ 最受歡迎校慶回憶
                </button>
            </div>
        </div>
    </aside>

    <!-- 主畫面區域 -->
    <main class="flex-1 flex flex-col h-full bg-gray-50 overflow-hidden w-full">
        <!-- 頂部導覽列 -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-3 sm:px-6 flex-shrink-0 z-10 gap-4">
            
            <!-- 左側：展開按鈕 -->
            <div class="flex items-center">
                <button id="header-menu-btn" onclick="toggleSidebar()" class="p-2 md:hidden text-gray-600 hover:bg-gray-100 rounded-full transition flex-shrink-0" title="展開選單">
                    <span class="material-icons">menu</span>
                </button>
            </div>

            <div class="hidden md:block flex-1"></div>

            <!-- 右側：連線狀態 -->
            <div class="flex items-center flex-shrink-0">
                <span class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full font-medium hidden sm:inline-block shadow-sm border border-green-200">
                    <span class="inline-block w-2 h-2 bg-green-500 rounded-full mr-1 animate-pulse"></span>已連線至雲端資料庫
                </span>
            </div>
            
        </header>

        <!-- 內容捲動區 -->
        <div class="flex-1 overflow-y-auto p-3 sm:p-6" id="scroll-container" onscroll="handleScroll(event)">
            <div class="w-full transition-all duration-300">
                <h2 id="current-category-title" class="text-sm font-semibold text-gray-500 mb-6 tracking-wider uppercase">全部相片</h2>
                
                <!-- 載入中狀態提示 -->
                <div id="loading" class="flex flex-col items-center justify-center py-20">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-4"></div>
                    <p class="text-gray-500 text-sm">正在載入相簿...</p>
                </div>

                <!-- 穩定瀑布流容器 (內部由 JS 動態建立直欄) -->
                <div id="photo-grid" class="stable-masonry-container"></div>

                <!-- 底部載入更多轉圈提示 -->
                <div id="load-more-spinner" class="hidden flex justify-center items-center py-8">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 圖片放大預覽 Modal -->
    <div id="modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 p-4 cursor-zoom-out" onclick="closeModal(event)">
        <div class="relative max-w-full max-h-[90vh]" onclick="event.stopPropagation()">
            <img id="modal-img" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl">
        </div>
    </div>

    <script>
        const API_KEY = "AIzaSyDOrQTECe6vXorg18AY82z4RYQuawIr9sQ";
        const ROOT_FOLDER_ID = "1abJxVWMe4b0Mpq6TTKD3ztSod0-06aQj";
        const DB_URL = "https://script.google.com/macros/s/AKfycbw86-rm7pTC3SFfYCuWTvKphvNHxrIB3IDOXKWh7Gyfy6pv2JFRSLgE-Tr2Ji9B1AQF/exec";

        let currentPhotos = [];
        let foldersMap = {};
        let currentActiveFolderId = 'all';
        let currentActiveFolderName = '全部相片';

        let displayedCount = 0;
        const PAGE_SIZE = 30;

        let likesCountData = {};
        let userLikedSet = new Set(JSON.parse(localStorage.getItem('shjhs_user_liked') || '[]'));
        let isLikeLoading = {};

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const headerBtn = document.getElementById('header-menu-btn');
            
            if (window.innerWidth >= 768) {
                if (sidebar.classList.contains('w-0')) {
                    sidebar.classList.replace('w-0', 'w-72');
                    sidebar.classList.remove('p-0', 'border-none');
                    sidebar.classList.add('p-4', 'border-r');
                    headerBtn.classList.add('md:hidden');
                } else {
                    sidebar.classList.replace('w-72', 'w-0');
                    sidebar.classList.add('p-0', 'border-none');
                    sidebar.classList.remove('p-4', 'border-r');
                    headerBtn.classList.remove('md:hidden');
                }
            } else {
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            }
        }

        async function fetchTopLevelFolders() {
            try {
                const query = `'${ROOT_FOLDER_ID}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
                const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&key=${API_KEY}&fields=files(id,name)`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.files) {
                    data.files.forEach(f => {
                        foldersMap[f.id] = f.name;
                    });
                }
                renderFolderList();
            } catch (err) {
                console.error("Fetch Folders Error:", err);
                renderFolderList();
            }
        }

        async function fetchPhotosInFolder(folderId, folderName) {
            let photos = [];
            try {
                const query = `'${folderId}' in parents and mimeType contains 'image/' and trashed = false`;
                const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&key=${API_KEY}&pageSize=200&fields=files(id,name,mimeType,thumbnailLink)`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.files) {
                    photos = data.files.map(item => ({
                        id: item.id,
                        name: item.name,
                        folderId: folderId,
                        folderName: folderName,
                        thumbUrl: item.thumbnailLink ? item.thumbnailLink.replace(/=s220/, '=s600') : '',
                        fullUrl: item.thumbnailLink ? item.thumbnailLink.replace(/=s220/, '=s1600') : ''
                    }));
                }
            } catch (err) {
                console.error("Fetch Photos Error:", err);
            }
            return photos;
        }

        async function fetchAllSubFolderPhotos() {
            let all = [];
            for (const [folderId, folderName] of Object.entries(foldersMap)) {
                const folderPhotos = await fetchPhotosInFolder(folderId, folderName);
                all = all.concat(folderPhotos);
            }
            return all;
        }

        async function fetchLikesData() {
            try {
                const response = await fetch(`${DB_URL}?action=getLikes`);
                const data = await response.json();
                return data;
            } catch (err) {
                console.error("Database fetch error:", err);
                return {};
            }
        }

        async function initPhotoGallery() {
            const loading = document.getElementById('loading');

            try {
                await fetchTopLevelFolders();

                const [likesResult, initialPhotos] = await Promise.all([
                    fetchLikesData(),
                    fetchAllSubFolderPhotos()
                ]);

                likesCountData = likesResult;
                window.allCachedPhotos = shuffleArray(initialPhotos);

                loading.remove();
                
                currentPhotos = window.allCachedPhotos;
                displayedCount = 0;
                initMasonryGrid();
                appendMorePhotos();

            } catch (err) {
                loading.remove();
                console.error(err);
            }
        }

        function renderFolderList() {
            const folderListContainer = document.getElementById('folder-list');
            
            const allBtnActive = currentActiveFolderId === 'all';
            const popularBtnActive = currentActiveFolderId === 'ai-popular';

            let html = `
                <button onclick="filterPhotosByFolder('all', '全部相片')" id="btn-all" class="w-full flex items-center gap-3 px-4 py-3 ${allBtnActive ? 'bg-blue-50 text-blue-700 font-medium' : 'text-gray-600 hover:bg-gray-100'} rounded-full text-sm transition text-left">
                    <span class="material-icons ${allBtnActive ? 'text-blue-600' : 'text-gray-400'}">photo_library</span>全部相片
                </button>
                <button onclick="filterPhotosByFolder('ai-popular', '✨ 最受歡迎校慶回憶')" id="btn-ai-popular" class="w-full flex items-center gap-3 px-4 py-3 ${popularBtnActive ? 'bg-blue-50 text-blue-700 font-medium' : 'text-gray-600 hover:bg-gray-100'} rounded-full text-sm transition text-left">
                    <span class="material-icons ${popularBtnActive ? 'text-blue-600' : 'text-blue-500'}">thumb_up</span>✨ 最受歡迎校慶回憶
                </button>
            `;

            for (const [folderId, folderName] of Object.entries(foldersMap)) {
                const isActive = currentActiveFolderId === folderId;
                html += `
                    <button onclick="filterPhotosByFolder('${folderId}', '${folderName}')" id="btn-${folderId}" class="w-full flex items-center gap-3 px-4 py-3 ${isActive ? 'bg-blue-50 text-blue-700 font-medium' : 'text-gray-600 hover:bg-gray-100'} rounded-full text-sm transition text-left truncate">
                        <span class="material-icons ${isActive ? 'text-blue-600' : 'text-gray-400'}">folder</span><span class="truncate">${folderName}</span>
                    </button>
                `;
            }

            folderListContainer.innerHTML = html;
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        async function filterPhotosByFolder(folderId, folderName) {
            currentActiveFolderId = folderId;
            currentActiveFolderName = folderName;
            document.getElementById('search-input').value = '';
            renderFolderList();
            document.getElementById('scroll-container').scrollTop = 0;

            const titleEl = document.getElementById('current-category-title');
            
            if (folderId === 'ai-popular') {
                titleEl.classList.add('hidden');
                currentPhotos = [...window.allCachedPhotos]
                    .filter(p => (likesCountData[p.id] || 0) > 0)
                    .sort((a, b) => (likesCountData[b.id] || 0) - (likesCountData[a.id] || 0));
            } else if (folderId === 'all') {
                titleEl.textContent = folderName;
                titleEl.classList.remove('hidden');
                currentPhotos = window.allCachedPhotos;
            } else {
                titleEl.textContent = folderName;
                titleEl.classList.remove('hidden');
                // 直接從快取中過濾該資料夾的照片（秒切換，不需重新發 API）
                currentPhotos = window.allCachedPhotos.filter(p => p.folderId === folderId);
            }

            displayedCount = 0;
            initMasonryGrid();
            appendMorePhotos();
        }

        function handleSearch() {
            const rawKeyword = document.getElementById('search-input').value;
            const keyword = rawKeyword.toLowerCase().trim();
            const titleEl = document.getElementById('current-category-title');

            if (!window.allCachedPhotos) return;

            if (keyword !== '') {
                currentPhotos = window.allCachedPhotos.filter(p => p.name.toLowerCase().includes(keyword));
                titleEl.textContent = `正在搜尋「${rawKeyword.trim()}」相關聯的相片`;
                titleEl.classList.remove('hidden');
            } else {
                if (currentActiveFolderId === 'ai-popular') {
                    titleEl.classList.add('hidden');
                } else {
                    titleEl.textContent = currentActiveFolderName;
                    titleEl.classList.remove('hidden');
                }
                currentPhotos = currentActiveFolderId === 'all' ? window.allCachedPhotos : window.allCachedPhotos.filter(p => p.folderId === currentActiveFolderId);
            }

            displayedCount = 0;
            initMasonryGrid();
            appendMorePhotos();
        }

        function getColumnCount() {
            const w = window.innerWidth;
            if (w >= 1280) return 6;
            if (w >= 1024) return 5;
            if (w >= 768) return 4;
            if (w >= 640) return 3;
            return 2;
        }

        function initMasonryGrid() {
            const grid = document.getElementById('photo-grid');
            grid.innerHTML = '';
            grid.className = "stable-masonry-container";
            const cols = getColumnCount();
            for (let i = 0; i < cols; i++) {
                const colDiv = document.createElement('div');
                colDiv.className = 'masonry-column';
                colDiv.id = `masonry-col-${i}`;
                grid.appendChild(colDiv);
            }
        }

        function appendMorePhotos() {
            const spinner = document.getElementById('load-more-spinner');

            if (currentPhotos.length === 0) {
                const grid = document.getElementById('photo-grid');
                grid.innerHTML = '';
                grid.className = "w-full flex flex-col items-center justify-center py-24 text-center";
                if (currentActiveFolderId === 'ai-popular') {
                    grid.innerHTML = `
                        <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 max-w-md mx-auto flex flex-col items-center">
                            <span class="material-icons text-blue-500 text-5xl mb-3 animate-bounce">thumb_up</span>
                            <p class="text-gray-800 font-bold text-base mb-1">目前還沒有人為相片點贊喔！</p>
                            <p class="text-gray-400 text-sm">快去瀏覽其他相片，為喜歡的回憶按下愛心吧 ❤️️</p>
                        </div>`;
                } else {
                    grid.innerHTML = `<p class="text-gray-400 text-sm py-10">此資料夾目前沒有相片</p>`;
                }
                spinner.classList.add('hidden');
                return;
            }

            const nextBatch = currentPhotos.slice(displayedCount, displayedCount + PAGE_SIZE);
            if (nextBatch.length === 0) {
                spinner.classList.add('hidden');
                return;
            }

            const cols = getColumnCount();

            nextBatch.forEach((file, index) => {
                const targetColIndex = (displayedCount + index) % cols;
                const colEl = document.getElementById(`masonry-col-${targetColIndex}`);
                if (!colEl) return;

                const likesCount = likesCountData[file.id] || 0;
                const hasLiked = userLikedSet.has(file.id);
                const btnLoadingClass = isLikeLoading[file.id] ? 'opacity-50 pointer-events-none' : '';

                const card = document.createElement('div');
                // 恢復自然的圖片比例與自適應高度（不強制置中、不固定高度）
                card.className = "relative group bg-white rounded-2xl overflow-hidden cursor-pointer shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 mb-3 sm:mb-4";
                
                card.innerHTML = `
                    <img src="${file.thumbUrl}" alt="${file.name}" class="w-full h-auto object-cover group-hover:scale-102 transition duration-300" loading="lazy">
                    
                    <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-between p-3">
                        <span class="text-white text-xs truncate drop-shadow">${file.name}</span>
                        
                        <div class="flex items-center justify-end gap-1.5" onclick="event.stopPropagation()">
                            <button id="like-btn-${file.id}" onclick="handleLike('${file.id}')" class="flex items-center gap-1 ${hasLiked ? 'bg-red-50 text-red-600' : 'bg-white/90 text-gray-800 hover:bg-white'} px-2.5 py-1.5 rounded-full text-xs font-medium shadow transition backdrop-blur-sm ${btnLoadingClass}">
                                <span id="like-icon-${file.id}" class="material-icons ${hasLiked ? 'text-red-500' : 'text-gray-400'} text-sm">${hasLiked ? 'favorite' : 'favorite_border'}</span>
                                <span id="like-count-${file.id}">${likesCount}</span>
                            </button>
                            <button onclick="handleDownload('${file.fullUrl}', '${file.name}')" class="p-1.5 bg-white/90 hover:bg-white text-gray-800 rounded-full shadow transition backdrop-blur-sm" title="下載原圖">
                                <span class="material-icons text-sm block">download</span>
                            </button>
                            <button onclick="handleShare('${file.fullUrl}', '${file.name}')" class="p-1.5 bg-white/90 hover:bg-white text-gray-800 rounded-full shadow transition backdrop-blur-sm" title="分享連結">
                                <span class="material-icons text-sm block">share</span>
                            </button>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    const modal = document.getElementById('modal');
                    const modalImg = document.getElementById('modal-img');
                    modalImg.src = file.fullUrl;
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                });

                colEl.appendChild(card);
            });

            displayedCount += nextBatch.length;

            if (displayedCount < currentPhotos.length) {
                spinner.classList.remove('hidden');
            } else {
                spinner.classList.add('hidden');
            }
        }

        function handleScroll(e) {
            const container = e.target;
            if (container.scrollTop + container.clientHeight >= container.scrollHeight - 400) {
                if (displayedCount < currentPhotos.length) {
                    if (!window.isFetchingMore) {
                        window.isFetchingMore = true;
                        setTimeout(() => {
                            appendMorePhotos();
                            window.isFetchingMore = false;
                        }, 100);
                    }
                }
            }
        }

        async function handleDownload(url, filename) {
            try {
                let safeFilename = filename || 'shjhs-photo.jpg';
                if (!safeFilename.toLowerCase().endsWith('.jpg') && !safeFilename.toLowerCase().endsWith('.png')) {
                    safeFilename += '.jpg';
                }

                const response = await fetch(url);
                const blob = await response.blob();
                const file = new File([blob], safeFilename, { type: 'image/jpeg' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: safeFilename
                    });
                } else {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = safeFilename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(blobUrl);
                }
            } catch (err) {
                alert('為保護隱私，系統即將為您開啟高畫質相片。請在相片上「長按」並選擇「儲存到照片/相簿」即可下載！');
                window.open(url, '_blank');
            }
        }

        function handleLike(fileId) {
            if (isLikeLoading[fileId]) return;

            const isLiking = !userLikedSet.has(fileId);
            const action = isLiking ? 'like' : 'unlike';

            isLikeLoading[fileId] = true;

            if (isLiking) {
                userLikedSet.add(fileId);
                likesCountData[fileId] = (likesCountData[fileId] || 0) + 1;
            } else {
                userLikedSet.delete(fileId);
                likesCountData[fileId] = Math.max(0, (likesCountData[fileId] || 1) - 1);
            }
            localStorage.setItem('shjhs_user_liked', JSON.stringify(Array.from(userLikedSet)));
            
            updateLikeUI(fileId);

            if (currentActiveFolderId === 'ai-popular') {
                filterPhotosByFolder('ai-popular', '✨ 最受歡迎校慶回憶');
            }

            fetch(`${DB_URL}?action=${action}&photoId=${encodeURIComponent(fileId)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.success) {
                        likesCountData[fileId] = data.likes;
                    }
                })
                .catch(err => console.error("同步讚數失敗", err))
                .finally(() => {
                    isLikeLoading[fileId] = false;
                    updateLikeUI(fileId);
                });
        }

        function updateLikeUI(fileId) {
            const hasLiked = userLikedSet.has(fileId);
            const btn = document.getElementById(`like-btn-${fileId}`);
            const icon = document.getElementById(`like-icon-${fileId}`);
            const countSpan = document.getElementById(`like-count-${fileId}`);

            if (countSpan) countSpan.textContent = likesCountData[fileId] || 0;
            if (btn && icon) {
                if (hasLiked) {
                    btn.className = "flex items-center gap-1 bg-red-50 text-red-600 px-2.5 py-1.5 rounded-full text-xs font-medium shadow transition backdrop-blur-sm";
                    icon.textContent = "favorite";
                    icon.className = "material-icons text-red-500 text-sm";
                } else {
                    btn.className = "flex items-center gap-1 bg-white/90 text-gray-800 hover:bg-white px-2.5 py-1.5 rounded-full text-xs font-medium shadow transition backdrop-blur-sm";
                    icon.textContent = "favorite_border";
                    icon.className = "material-icons text-gray-400 text-sm";
                }

                if (isLikeLoading[fileId]) {
                    btn.classList.add('opacity-50', 'pointer-events-none');
                }
            }
        }

        function handleShare(url, name) {
            if (navigator.share) {
                navigator.share({
                    title: name,
                    text: '三峽國中 80週年校慶回憶 - ' + name,
                    url: url,
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(url);
                alert('已複製相片連結！');
            }
        }

        function closeModal(event) {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        window.addEventListener('DOMContentLoaded', initPhotoGallery);
    </script>
</body>
</html>
