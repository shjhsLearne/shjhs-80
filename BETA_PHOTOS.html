<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三峽國中 - 歷年畢業紀念冊集錦</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-white text-gray-800 flex h-screen overflow-hidden">

    <!-- 手機/平板側邊欄背後的半透明遮罩 -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden transition-opacity" onclick="toggleSidebar()"></div>

    <!-- 側邊欄（支援響應式滑出與收合） -->
    <aside id="sidebar" class="w-72 flex-shrink-0 flex flex-col border-r border-gray-200 p-4 select-none bg-white fixed md:static inset-y-0 left-0 z-30 transform -translate-x-full md:translate-x-0 transition-all duration-300 overflow-hidden shadow-xl md:shadow-none">
        <div class="flex items-center justify-between px-2 mb-6 min-w-[250px]">
            <div class="flex items-center gap-3">
                <img src="https://lh3.googleusercontent.com/d/13oP5AHjeYAC7eOud7dizpkiV-hxzlGUL=s400" alt="Logo" class="w-10 h-10 rounded-full object-cover flex-shrink-0 shadow-sm border border-gray-100">
                <div>
                    <h1 class="text-sm font-bold text-gray-800 leading-tight">三峽國中</h1>
                    <p class="text-xs text-blue-600 font-medium">歷年畢業紀念冊集錦</p>
                </div>
            </div>
            <!-- 電腦版收合按鈕 -->
            <button onclick="toggleSidebar()" class="hidden md:flex p-1.5 text-gray-500 hover:bg-gray-100 rounded-lg transition" title="收合選單">
                <span class="material-icons text-xl">menu_open</span>
            </button>
        </div>

        <!-- 導覽與資料夾選單區 -->
        <div class="flex-1 overflow-y-auto space-y-1 pr-1 min-w-[250px]">
            <p class="px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">相簿選單</p>
            <div id="folder-list" class="space-y-1">
                <button onclick="filterPhotosByFolder('all')" id="btn-all" class="w-full flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-700 rounded-full font-medium text-sm transition text-left">
                    <span class="material-icons text-blue-600">photo_library</span>全部相片
                </button>
            </div>
        </div>
    </aside>

    <!-- 主畫面區域 -->
    <main class="flex-1 flex flex-col h-full bg-gray-50 overflow-hidden w-full">
        <!-- 頂部導覽列 (特別為手機版增加安全左右與上方空間) -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-3 sm:px-6 flex-shrink-0 z-10 gap-2">
            <div class="flex items-center gap-2 flex-1 min-w-0">
                <!-- 漢堡選單按鈕：增加 ml-1 確保左側有完美留白，絕不被切掉 -->
                <button onclick="toggleSidebar()" class="p-2 ml-1 text-gray-600 hover:bg-gray-100 rounded-full transition flex-shrink-0" title="切換選單">
                    <span class="material-icons">menu</span>
                </button>
                <!-- 搜尋框 -->
                <div class="flex items-center flex-1 bg-gray-100 rounded-full px-3 sm:px-4 py-2 min-w-0">
                    <span class="material-icons text-gray-500 mr-2 text-sm md:text-base flex-shrink-0">search</span>
                    <input type="text" id="search-input" placeholder="搜尋相片..." class="bg-transparent border-none outline-none w-full text-sm text-gray-700 truncate" oninput="handleSearch()">
                </div>
            </div>
            <div class="flex items-center gap-3 flex-shrink-0">
                <span class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full font-medium hidden sm:inline-block">已連線 Google 雲端硬碟</span>
            </div>
        </header>

        <!-- 內容捲動區 -->
        <div class="flex-1 overflow-y-auto p-3 sm:p-6" id="scroll-container">
            <div class="max-w-7xl mx-auto">
                <h2 id="current-category-title" class="text-sm font-semibold text-gray-500 mb-4 tracking-wider uppercase">全部相片</h2>
                
                <!-- 載入中狀態提示 -->
                <div id="loading" class="flex flex-col items-center justify-center py-20">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-4"></div>
                    <p class="text-gray-500 text-sm">正在從雲端硬碟載入資料夾與相片中...</p>
                </div>

                <!-- 錯誤訊息提示 -->
                <div id="error-box" class="hidden bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl text-sm mb-4"></div>

                <!-- RWD 圖片網格容器 -->
                <div id="photo-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2 sm:gap-3"></div>
            </div>
        </div>
    </main>

    <!-- 圖片放大預覽 Modal -->
    <div id="modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 p-4 cursor-zoom-out" onclick="closeModal()">
        <img id="modal-img" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl">
    </div>

    <script>
        const API_KEY = "AIzaSyDOrQTECe6vXorg18AY82z4RYQuawIr9sQ";
        const ROOT_FOLDER_ID = "1abJxVWMe4b0Mpq6TTKD3ztSod0-06aQj";

        let allPhotos = [];
        let foldersMap = {};
        let currentActiveFolderId = 'all';

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            if (window.innerWidth >= 768) {
                if (sidebar.style.width === '0px' || sidebar.classList.contains('collapsed')) {
                    sidebar.style.width = '288px';
                    sidebar.classList.remove('collapsed', 'p-0', 'border-none');
                    sidebar.classList.add('p-4', 'border-r');
                } else {
                    sidebar.style.width = '0px';
                    sidebar.classList.add('collapsed', 'p-0', 'border-none');
                    sidebar.classList.remove('p-4', 'border-r');
                }
            } else {
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            }
        }

        async function fetchDriveData(folderId, currentFolderName = "根目錄") {
            let results = { photos: [], subFolders: [] };
            try {
                const query = `'${folderId}' in parents and trashed = false`;
                const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&key=${API_KEY}&fields=files(id,name,mimeType,thumbnailLink)`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (data.error) return results;

                const items = data.files || [];

                for (const item of items) {
                    if (item.mimeType === 'application/vnd.google-apps.folder') {
                        foldersMap[item.id] = item.name;
                        results.subFolders.push(item);
                    } else if (item.mimeType && item.mimeType.startsWith('image/')) {
                        results.photos.push({
                            id: item.id,
                            name: item.name,
                            folderId: folderId,
                            folderName: currentFolderName,
                            thumbUrl: item.thumbnailLink ? item.thumbnailLink.replace(/=s220/, '=s400') : '',
                            fullUrl: item.thumbnailLink ? item.thumbnailLink.replace(/=s220/, '=s1600') : ''
                        });
                    }
                }

                for (const sub of results.subFolders) {
                    const subResult = await fetchDriveData(sub.id, sub.name);
                    results.photos = results.photos.concat(subResult.photos);
                }
            } catch (err) {
                console.error(err);
            }
            return results;
        }

        async function initPhotoGallery() {
            const loading = document.getElementById('loading');
            const errorBox = document.getElementById('error-box');

            try {
                const result = await fetchDriveData(ROOT_FOLDER_ID);
                allPhotos = result.photos;
                loading.remove();

                if (allPhotos.length === 0) {
                    errorBox.textContent = "找不到任何圖片，請確認雲端硬碟資料夾權限是否正確。";
                    errorBox.classList.remove('hidden');
                    return;
                }

                const folderListContainer = document.getElementById('folder-list');
                for (const [folderId, folderName] of Object.entries(foldersMap)) {
                    const btn = document.createElement('button');
                    btn.className = "w-full flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-full text-sm transition text-left truncate";
                    btn.id = `btn-${folderId}`;
                    btn.innerHTML = `<span class="material-icons text-gray-400">folder</span><span class="truncate">${folderName}</span>`;
                    btn.onclick = () => {
                        filterPhotosByFolder(folderId, folderName);
                        if (window.innerWidth < 768) toggleSidebar();
                    };
                    folderListContainer.appendChild(btn);
                }

                renderPhotos(allPhotos);

            } catch (err) {
                loading.remove();
                errorBox.textContent = "載入失敗：" + err.message;
                errorBox.classList.remove('hidden');
            }
        }

        function renderPhotos(photosToRender) {
            const grid = document.getElementById('photo-grid');
            grid.innerHTML = '';

            if (photosToRender.length === 0) {
                grid.innerHTML = `<p class="text-gray-400 text-sm col-span-full py-10 text-center">沒有找到符合的相片</p>`;
                return;
            }

            photosToRender.forEach(file => {
                const card = document.createElement('div');
                card.className = "relative group aspect-square bg-gray-200 rounded-xl overflow-hidden cursor-pointer shadow-sm hover:shadow-md transition";
                card.innerHTML = `
                    <img src="${file.thumbUrl}" alt="${file.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent opacity-0 group-hover:opacity-100 transition flex items-end p-3">
                        <span class="text-white text-xs truncate">${file.name}</span>
                    </div>
                `;

                card.addEventListener('click', () => {
                    const modal = document.getElementById('modal');
                    const modalImg = document.getElementById('modal-img');
                    modalImg.src = file.fullUrl;
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                });

                grid.appendChild(card);
            });
        }

        function filterPhotosByFolder(folderId, folderName = "全部相片") {
            currentActiveFolderId = folderId;
            document.getElementById('current-category-title').textContent = folderName;
            document.getElementById('search-input').value = '';

            document.querySelectorAll('#folder-list button').forEach(btn => {
                btn.className = "w-full flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-full text-sm transition text-left truncate";
                const icon = btn.querySelector('.material-icons');
                if (icon) icon.className = "material-icons text-gray-400";
            });

            const activeBtn = document.getElementById(folderId === 'all' ? 'btn-all' : `btn-${folderId}`);
            if (activeBtn) {
                activeBtn.className = "w-full flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-700 rounded-full font-medium text-sm transition text-left truncate";
                const icon = activeBtn.querySelector('.material-icons');
                if (icon) icon.className = "material-icons text-blue-600";
            }

            applyFilters();
        }

        function handleSearch() {
            applyFilters();
        }

        function applyFilters() {
            const keyword = document.getElementById('search-input').value.toLowerCase().trim();

            let result = currentActiveFolderId === 'all' 
                ? allPhotos 
                : allPhotos.filter(p => p.folderId === currentActiveFolderId);

            if (keyword !== '') {
                result = result.filter(p => p.name.toLowerCase().includes(keyword));
            }

            renderPhotos(result);
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        window.addEventListener('DOMContentLoaded', initPhotoGallery);
    </script>
</body>
</html>
